<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean & Care - المدراء</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#1f2937;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
header h1{margin:0;font-size:24px}
button{
  border:0;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  font-size:15px;
  background:#2563eb;
  color:white;
}
button:hover{opacity:.9}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-edit{background:#f59e0b}
.btn-secondary{background:#6b7280}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.card h2{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
label{font-weight:bold}
input{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
  background:white;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
.permissions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-top:8px;
}
.permission{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  background:#fafafa;
}
.permission label{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.permission input{width:auto}
.status-box{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}
.status-box label{
  display:flex;
  align-items:center;
  gap:6px;
}
.status-box input{width:auto}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:20px;
}
.stat{
  background:white;
  padding:18px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}
.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}
th,td{
  border-bottom:1px solid #e5e7eb;
  padding:12px 10px;
  text-align:right;
  vertical-align:top;
}
th{background:#f3f4f6}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:13px;
}
.active{
  background:#dcfce7;
  color:#166534;
}
.inactive{
  background:#fee2e2;
  color:#991b1b;
}
.permission-list{line-height:1.8}
.empty{
  text-align:center;
  padding:30px;
  color:#777;
}
.hidden{display:none}
.small{
  font-size:13px;
  color:#666;
}
.photo-preview{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:8px;
}
.message{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}
.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}
.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}
@media(max-width:600px){
  header{align-items:stretch}
  header button{width:100%}
  .container{padding:0 10px}
  .card{padding:15px}
}
</style>
</head>

  <h1 id="pageTitle">المدراء والصلاحيات</h1>

    <button onclick="toggleLanguage()" id="languageBtn">Deutsch</button>
    <button onclick="goHome()" class="btn-secondary" id="backBtn">الرئيسية</button>

        <label id="nameLabel">الاسم</label>

      <div class="field">
        <label id="phoneLabel">رقم الهاتف</label>

      <div class="field">

        <input type="file" id="photo" accept="image/*">

    </div>

    <div class="card" style="margin-top:20px;background:#f9fafb">
      <h3 id="statusTitle">حالة الحساب</h3>
      <div class="status-box">
        <label>
          <input type="radio" name="status" value="active" checked>

    <div class="card" style="margin-top:20px;background:#f9fafb">
      <h3 id="permissionsTitle">الصلاحيات</h3>

      <div class="permissions">
        <div class="permission"><label><input type="checkbox" id="permWorkers"><span id="permWorkersLabel">العمال</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permHotels"><span id="permHotelsLabel">الفنادق</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permTrains"><span id="permTrainsLabel">القطارات</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permInventory"><span id="permInventoryLabel">المخزون</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permRules"><span id="permRulesLabel">قواعد المواد</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permRepairs"><span id="permRepairsLabel">الإصلاحات</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permInvoices"><span id="permInvoicesLabel">الفواتير</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permOtherPlaces"><span id="permOtherPlacesLabel">أماكن أخرى</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permReports"><span id="permReportsLabel">التقارير</span></label></div>
        <div class="permission"><label><input type="checkbox" id="permManagers"><span id="permManagersLabel">المدراء</span></label></div>
      </div>
    </div>

    <div class="card" style="margin-top:20px;background:#f9fafb">
      <h3 id="reportsTitle">إشعارات التقارير</h3>

      <div class="permissions">
        <div class="permission">
          <label>
            <input type="checkbox" id="reminderReports">
            <span id="reminderReportsLabel">تقارير التذكير</span>

        </div>

        <div class="permission">
          <label>
            <input type="checkbox" id="completionReports">
            <span id="completionReportsLabel">تقارير إنجاز العمل</span>
          </label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button onclick="saveManager()" id="saveBtn">حفظ</button>
      <button onclick="cancelEdit()" class="btn-secondary hidden" id="cancelBtn">إلغاء</button>
    </div>
  </div>

  <div class="card">
    <h2 id="listTitle">المدراء المسجلون</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th id="thName">الاسم</th>

            <th id="thEmail">البريد</th>

    </div>

    <div id="emptyMessage" class="empty hidden">لا يوجد مدراء مسجلون.</div>
  </div>

</div>

function t(key){
  return translations[language][key] || key;
}

function applyLanguage(){
  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  const tr = translations[language];

  Object.keys(tr).forEach(key=>{
    const el = document.getElementById(key);
    if(el) el.textContent = tr[key];
  });

  updateFormTitle();
  render();
}

function toggleLanguage(){
  language = language === "ar" ? "de" : "ar";
  localStorage.setItem("appLanguage", language);
  applyLanguage();
}

function goHome(){
  window.location.href = "index.html";
}

function showMessage(text,type="success"){
  const box = document.getElementById("messageBox");
  box.textContent = text;
  box.className = "message " + type;

  setTimeout(()=>{
    box.className = "message";
  },5000);
}

function getPermissions(){
  const list = [];

  if(document.getElementById("permWorkers").checked) list.push("workers");
  if(document.getElementById("permHotels").checked) list.push("hotels");
  if(document.getElementById("permTrains").checked) list.push("trains");
  if(document.getElementById("permInventory").checked) list.push("inventory");
  if(document.getElementById("permRules").checked) list.push("rules");
  if(document.getElementById("permRepairs").checked) list.push("repairs");
  if(document.getElementById("permInvoices").checked) list.push("invoices");
  if(document.getElementById("permOtherPlaces").checked) list.push("otherPlaces");
  if(document.getElementById("permReports").checked) list.push("reports");
  if(document.getElementById("permManagers").checked) list.push("managers");

  return list;
}

function setPermissions(list){
  const permissions = Array.isArray(list) ? list : [];

  document.getElementById("permWorkers").checked = permissions.includes("workers");
  document.getElementById("permHotels").checked = permissions.includes("hotels");
  document.getElementById("permTrains").checked = permissions.includes("trains");
  document.getElementById("permInventory").checked = permissions.includes("inventory");
  document.getElementById("permRules").checked = permissions.includes("rules");
  document.getElementById("permRepairs").checked = permissions.includes("repairs");
  document.getElementById("permInvoices").checked = permissions.includes("invoices");
  document.getElementById("permOtherPlaces").checked = permissions.includes("otherPlaces");
  document.getElementById("permReports").checked = permissions.includes("reports");
  document.getElementById("permManagers").checked = permissions.includes("managers");
}

function updateFormTitle(){
  document.getElementById("formTitle").textContent =
    editId ? t("formEdit") : t("formAdd");

  document.getElementById("saveBtn").textContent =
    editId ? t("updateBtn") : t("saveBtn");
}

function resetForm(){
  editId = null;
  selectedPhoto = "";

  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("email").value = "";
  document.getElementById("email").disabled = false;
  document.getElementById("password").value = "";

  document.getElementById("passwordField").classList.remove("hidden");

  document.getElementById("photo").value = "";

  const preview = document.getElementById("photoPreview");
  preview.src = "";
  preview.classList.add("hidden");

  document.querySelector(
    'input[name="status"][value="active"]'
  ).checked = true;

  setPermissions([]);

  document.getElementById("reminderReports").checked = false;
  document.getElementById("completionReports").checked = false;

  document.getElementById("cancelBtn").classList.add("hidden");

  updateFormTitle();
}

function cancelEdit(){
  resetForm();
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(){
  const tbody = document.getElementById("managersTable");
  const empty = document.getElementById("emptyMessage");

  tbody.innerHTML = "";

  document.getElementById("statTotal").textContent = managers.length;
  document.getElementById("statActive").textContent =
    managers.filter(m=>m.active === true).length;
  document.getElementById("statInactive").textContent =
    managers.filter(m=>m.active !== true).length;

  empty.textContent = t("empty");

  if(managers.length === 0){
    empty.classList.remove("hidden");
    return;
  }

  empty.classList.add("hidden");

  managers.forEach(manager=>{
    const permissions =
      Array.isArray(manager.permissions)
        ? manager.permissions
        : [];

    const permissionText =
      permissions.length
        ? permissions.map(p=>t(p)).join("، ")
        : t("noPermissions");

    const reportList = [];

    if(manager.reminder_reports){
      reportList.push(t("reminder"));
    }

    if(manager.completion_reports){
      reportList.push(t("completion"));
    }

    const reportText =
      reportList.length
        ? reportList.join("، ")
        : t("noReports");

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHtml(manager.name || "")}</td>
      <td>${escapeHtml(manager.phone || "")}</td>
      <td>${escapeHtml(manager.email || "")}</td>

      <td>
        <span class="badge ${manager.active ? "active" : "inactive"}">
          ${manager.active ? t("active") : t("inactive")}
        </span>
      </td>

      <td class="permission-list">
        ${escapeHtml(permissionText)}
      </td>

      <td>
        ${escapeHtml(reportText)}
      </td>

      <td>
        <button
          class="btn-edit"
          onclick="editManager('${manager.id}')"
        >
          ${t("edit")}
        </button>
      </td>
    `;

    tbody.appendChild(row);
  });
}

async function loadManagers(){
  const { data, error } = await supabaseClient
    .from("profiles")
    .select(
      "id,name,phone,email,photo,active,permissions,reminder_reports,completion_reports,role"
    )
    .order("name", { ascending:true });

  if(error){
    console.error("Load managers error:", error);
    managers = [];
    render();
    showMessage(t("loadError") + " " + error.message, "error");
    return;
  }

  managers = data || [];
  render();
}

function editManager(id){
  const manager = managers.find(
    item => String(item.id) === String(id)
  );

  if(!manager) return;

  editId = manager.id;

  document.getElementById("name").value = manager.name || "";
  document.getElementById("phone").value = manager.phone || "";
  document.getElementById("email").value = manager.email || "";

  document.getElementById("email").disabled = true;
  document.getElementById("passwordField").classList.add("hidden");

  selectedPhoto = manager.photo || "";

  const preview = document.getElementById("photoPreview");

  if(selectedPhoto){
    preview.src = selectedPhoto;
    preview.classList.remove("hidden");
  }else{
    preview.src = "";
    preview.classList.add("hidden");
  }

  const status =
    manager.active === true ? "active" : "inactive";

  document.querySelector(
    `input[name="status"][value="${status}"]`
  ).checked = true;

  setPermissions(manager.permissions);

  document.getElementById("reminderReports").checked =
    manager.reminder_reports === true;

  document.getElementById("completionReports").checked =
    manager.completion_reports === true;

  document.getElementById("cancelBtn").classList.remove("hidden");

  updateFormTitle();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function readPhoto(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();

    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

document.getElementById("photo").addEventListener(
  "change",
  async function(){

    const file = this.files[0];

    if(!file) return;

    try{
      selectedPhoto = await readPhoto(file);

      const preview =
        document.getElementById("photoPreview");

      preview.src = selectedPhoto;
      preview.classList.remove("hidden");

    }catch(error){
      console.error(error);
    }
  }
);

async function saveManager(){
  const saveBtn = document.getElementById("saveBtn");

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const statusInput =
    document.querySelector(
      'input[name="status"]:checked'
    );

  const active =
    statusInput
      ? statusInput.value === "active"
      : true;

  const permissions = getPermissions();

  const reminderReports =
    document.getElementById("reminderReports").checked;

  const completionReports =
    document.getElementById("completionReports").checked;

  if(!name){
    showMessage(t("enterName"),"error");
    return;
  }

  if(!email){
    showMessage(t("enterEmail"),"error");
    return;
  }

  if(!editId && (!password || password.length < 6)){
    showMessage(t("enterPassword"),"error");
    return;
  }

  saveBtn.disabled = true;

  try{
    if(editId){
      const { error } = await supabaseClient
        .from("profiles")
        .update({
          name:name,
          phone:phone,
          photo:selectedPhoto || null,
          active:active,
          permissions:permissions,
          reminder_reports:reminderReports,
          completion_reports:completionReports
        })
        .eq("id",editId);

      if(error){
        throw error;
      }

      showMessage(t("updated"),"success");

      resetForm();
      await loadManagers();

    }else{
      const {
        data:{ session },
        error:sessionError
      } = await supabaseClient.auth.getSession();

      if(sessionError || !session){
        showMessage(t("loginError"),"error");
        saveBtn.disabled = false;
        return;
      }

      const response = await fetch(
        SERVER_URL + "/admin/create-user",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":
              "Bearer " + session.access_token
          },
          body:JSON.stringify({
            name:name,
            phone:phone,
            email:email,
            password:password,
            active:active,
            permissions:permissions,
            reminderReports:reminderReports,
            completionReports:completionReports,
            photo:selectedPhoto || null
          })
        }
      );

      let result = {};

      try{
        result = await response.json();
      }catch(e){}

      if(!response.ok){
        throw new Error(
          result.error ||
          result.message ||
          t("serverError")
        );
      }

      showMessage(t("saved"),"success");

      resetForm();
      await loadManagers();
    }

  }catch(error){
    console.error("Save manager error:",error);

    showMessage(
      error.message || t("serverError"),
      "error"
    );

  }finally{
    saveBtn.disabled = false;
  }
}

async function startPage(){
  applyLanguage();

  const {
    data:{ session },
    error
  } = await supabaseClient.auth.getSession();

  if(error || !session){
    window.location.href = "login.html";
    return;
  }

  await loadManagers();
}

startPage();
</script>

</body>
</html>
